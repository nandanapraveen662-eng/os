<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Round Robin OS Visualiser</title>
<style>
:root{--bg:#f3f5f7;--sf:#fff;--tx:#14202b;--mu:#5d6b78;--bd:#d5dce3;--cs:#d64545;--ac:#1f6feb;--ac2:#e08a1e;--ok:#1d9a6c;--idle:#aab4be;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1419;--sf:#172029;--tx:#e6edf3;--mu:#93a1ad;--bd:#2a3743;--cs:#ef6a6a;--ac:#5b9cff;--ac2:#f0a64a;--ok:#3cc48f;--idle:#51606c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1419;--sf:#172029;--tx:#e6edf3;--mu:#93a1ad;--bd:#2a3743;--cs:#ef6a6a;--ac:#5b9cff;--ac2:#f0a64a;--ok:#3cc48f;--idle:#51606c;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.num,table td,table th,.gs,.ax span{font-variant-numeric:tabular-nums}
main{max-width:1100px;margin:0 auto;padding:18px 14px 60px}
h1{font:700 26px/1.2 Georgia,"Times New Roman",serif;margin:6px 0 4px}
h2{font:700 18px/1.3 Georgia,serif;margin:0 0 8px}
p.sub{color:var(--mu);margin:0 0 14px;max-width:70ch}
.tabs{display:flex;gap:8px;margin:12px 0}
button,select,input{font:inherit;color:var(--tx)}
button{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:7px 13px;cursor:pointer}
button:hover{border-color:var(--ac)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:12px 0}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
label.f{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}
input,select{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:5px 8px}
input[type=number]{width:70px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-weight:600;font-size:12px}
.tw{overflow-x:auto}
.live{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.live{grid-template-columns:1fr}}
.cpu{border-radius:10px;padding:16px;color:#fff;min-height:104px;transition:background .2s}
.cpu b{font-size:24px;display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;min-height:34px;align-items:center}
.chip{padding:3px 11px;border-radius:99px;color:#fff;font-weight:600;font-size:13px}
.pc{display:grid;grid-template-columns:96px 1fr 88px;gap:8px;align-items:center;padding:5px 0;font-size:13px}
.bar{height:12px;background:var(--bg);border:1px solid var(--bd);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;transition:width .25s}
.st{font-weight:600;font-size:12px;text-align:right}
.narr{border-left:4px solid var(--ac);padding:8px 12px;background:var(--bg);border-radius:0 8px 8px 0;margin:10px 0;min-height:44px}
.log{max-height:150px;overflow:auto;font-size:13px;color:var(--mu)}.log div{padding:2px 0;border-bottom:1px dashed var(--bd)}
.log b{color:var(--tx)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.ctl input[type=range]{flex:1;min-width:160px;padding:0}
.clock{font:700 20px Georgia,serif;min-width:90px}
.gl{font-weight:600;margin:10px 0 4px;font-size:13px}
.gwrap{overflow-x:auto;padding-bottom:4px;cursor:pointer}
.gin{position:relative;height:74px}
.gs{position:absolute;top:0;height:38px;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;border-right:1px solid rgba(255,255,255,.6);overflow:hidden}
.gs.cs{background:repeating-linear-gradient(45deg,var(--cs),var(--cs) 4px,#a02c2c 4px,#a02c2c 8px)}
.gs.idle{background:var(--idle)}
.ax{position:absolute;top:42px;left:0;right:0;height:22px}
.ax span{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--mu)}
.mask{position:absolute;top:0;height:38px;background:var(--sf);opacity:.72}
.ph{position:absolute;top:-4px;height:48px;width:2px;background:var(--tx)}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:6px}.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.mrow{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd);font-size:13px}
@media(max-width:600px){.mrow{grid-template-columns:1fr}}
.mb{display:flex;align-items:center;gap:8px;margin:2px 0}.mb i{display:block;height:13px;border-radius:3px;min-width:2px;transition:width .3s}
.rec{border:2px solid var(--ok);border-radius:10px;padding:12px;margin-top:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){.two{grid-template-columns:1fr}}
.win{color:var(--ok);font-weight:700}
.hint{font-size:12px;color:var(--mu)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main>
<h1>Round Robin scheduling visualiser</h1>
<p class="sub">Press play to watch the processor second by second: who runs, who waits, what the ready queue holds and where each 1 ms context switch happens. Edit any value and the schedule, Gantt charts and comparison rebuild instantly.</p>
<div class="tabs" id="tabs"></div><div id="app"></div>
</main>
<script>
const COL=['#1f8a7a','#d9820f','#3f6fd8','#a64fc0','#d4553a','#6a9a2a'];
const ACTS=[
{key:'a1',title:'Activity 1: Municipal control centre (SDG 6, 11, 12), no switching overhead',ov:0,ovEdit:false,qA:2,qB:3,
 procs:[['P1','Water-quality monitoring',0,5],['P2','Waste-collection scheduling',1,3],['P3','Traffic-pollution analysis',2,4],['P4','Public energy-use monitoring',3,2]]},
{key:'a2',title:'Activity 2: Climate emergency centre (SDG 11, 13), 1 ms switching overhead',ov:1,ovEdit:true,qA:2,qB:4,thr:4,
 procs:[['P1','Flood-warning analysis',0,5],['P2','Air-quality alert generation',1,4],['P3','Emergency evacuation route update',2,3],['P4','Renewable-grid status monitoring',3,2]]}];
const fmt=x=>Number.isInteger(x)?String(x):x.toFixed(2);

function simulate(procs,q,ov){
 const P=procs.map((p,i)=>({i,name:p.name,task:p.task,arrival:p.arrival,burst:p.burst,rem:p.burst,start:null,ct:null}));
 const order=[...P].sort((a,b)=>a.arrival-b.arrival||a.i-b.i);
 let t=0,ai=0,queue=[],segs=[],last=null,done=0;
 const admit=()=>{while(ai<order.length&&order[ai].arrival<=t)queue.push(order[ai++])};
 while(done<P.length){
  admit();
  if(!queue.length){const na=order[ai].arrival;segs.push({type:'idle',s:t,e:na,q:[]});t=na;continue}
  const p=queue.shift();
  if(last&&last!==p&&ov>0){segs.push({type:'cs',s:t,e:t+ov,from:last,to:p,q:queue.map(x=>x.i)});t+=ov;admit()}
  const run=Math.min(q,p.rem);if(p.start===null)p.start=t;
  segs.push({type:'run',p,s:t,e:t+run,q:queue.map(x=>x.i),remBefore:p.rem,remAfter:p.rem-run});
  t+=run;p.rem-=run;admit();
  if(p.rem>0)queue.push(p);else{p.ct=t;done++}
  last=p;
 }
 const total=t;
 P.forEach(p=>{p.tat=p.ct-p.arrival;p.wt=p.tat-p.burst;p.rt=p.start-p.arrival});
 const runs=segs.filter(s=>s.type==='run');
 let sw=0;for(let i=1;i<runs.length;i++)if(runs[i].p!==runs[i-1].p)sw++;
 const overhead=segs.filter(s=>s.type==='cs').reduce((a,s)=>a+s.e-s.s,0);
 const busy=P.reduce((a,p)=>a+p.burst,0),n=P.length;
 const avg=k=>P.reduce((a,p)=>a+p[k],0)/n;
 const ev=[];
 P.forEach(p=>ev.push({t:p.arrival,pr:1,x:`<b>${p.name}</b> arrives (${p.task}) and joins the ready queue`}));
 segs.forEach(s=>{
  if(s.type==='run'){
   ev.push({t:s.s,pr:2,x:`CPU dispatches <b>${s.p.name}</b> (${s.remBefore} ms left, up to ${q} ms)`});
   ev.push({t:s.e,pr:0,x:s.remAfter===0?`<b>${s.p.name}</b> finishes. Completion time = ${s.e} ms`:`Quantum expired: <b>${s.p.name}</b> is preempted with ${s.remAfter} ms left and goes to the back of the queue`});
  }else if(s.type==='cs')ev.push({t:s.s,pr:2,x:`Context switch <b>${s.from.name} → ${s.to.name}</b> starts (${s.e-s.s} ms of pure overhead)`});
 });
 ev.sort((a,b)=>a.t-b.t||a.pr-b.pr);
 return{q,ov,P,segs,total,sw,overhead,busy,eff:busy/total*100,tat:avg('tat'),wt:avg('wt'),rt:avg('rt'),ev};
}
const segAt=(s,t)=>s.segs.find(g=>g.s<=t&&t<g.e);
const executed=(s,i,t)=>s.segs.reduce((a,g)=>a+(g.type==='run'&&g.p.i===i?Math.max(0,Math.min(g.e,t)-g.s):0),0);
function queueAt(s,t,g){
 if(!g)return[];
 const extra=s.P.filter(p=>p.arrival>g.s&&p.arrival<=t).sort((a,b)=>a.arrival-b.arrival||a.i-b.i).map(p=>p.i);
 return[...g.q,...extra];
}
function tickText(s,t,g){
 if(!g)return'All processes have finished. Review the results below.';
 const k=t-g.s;
 if(g.type==='run')return`<b>${g.p.name}</b> executes for this millisecond. Remaining burst ${g.remBefore-k} → ${g.remBefore-k-1} ms. Quantum used: ${k+1} of ${s.q} ms.`+(t+1===g.e?(g.remAfter===0?' It completes at the end of this tick.':' The quantum ends here, so it is preempted.'):'');
 if(g.type==='cs')return`<b>Context switch ${g.from.name} → ${g.to.name}</b> (tick ${k+1} of ${g.e-g.s}). The CPU saves one process state and loads the other. No useful work happens.`;
 return'CPU idle: no process is ready. Waiting for the next arrival.';
}
function gantt(s,t,label){
 const u=32;
 let h=`<div class="gl">${label}</div><div class="gwrap" data-g="${u}"><div class="gin" style="width:${s.total*u+2}px">`;
 h+=s.segs.map(g=>{
  const d=g.e-g.s,tip=g.type==='run'?`${g.p.name} ${g.p.task}: ${g.s} to ${g.e} ms`:g.type==='cs'?`Context switch ${g.from.name} to ${g.to.name}: ${g.s} to ${g.e} ms`:`Idle ${g.s} to ${g.e} ms`;
  return`<div class="gs ${g.type}" title="${tip}" style="left:${g.s*u}px;width:${d*u}px;${g.type==='run'?'background:'+COL[g.p.i]:''}">${g.type==='run'?g.p.name:g.type==='cs'?(d>1?'CS':'CS'):''}</div>`}).join('');
 h+=`<div class="mask" style="left:${t*u}px;width:${(s.total-t)*u}px"></div><div class="ph" style="left:${t*u}px"></div><div class="ax">`;
 for(let i=0;i<=s.total;i++)h+=`<span style="left:${i*u}px">${i}</span>`;
 return h+'</div></div></div>';
}
function legend(P){return`<div class="lg">${P.map(p=>`<span><i style="background:${COL[p.i]}"></i>${p.name} ${p.task}</span>`).join('')}<span><i style="background:var(--cs)"></i>Context switch</span><span><i style="background:var(--idle)"></i>Idle</span></div>`}

function recommend(act,A,B){
 if(act.ovEdit){
  const thr=act.thr,ok=[A,B].filter(s=>s.rt<=thr);
  let pick,why;
  if(ok.length){pick=ok.sort((a,b)=>a.overhead-b.overhead||a.rt-b.rt)[0];const o=pick===A?B:A;
   why=`With an acceptable average response time of ${thr} ms, Q = ${pick.q} ms is the best choice. It wastes ${pick.overhead} ms on switching (CPU efficiency ${fmt(pick.eff)}%) and gives an average response time of ${fmt(pick.rt)} ms.`+(o.rt>thr?` Q = ${o.q} ms is rejected because its average response time of ${fmt(o.rt)} ms exceeds the limit, even though its overhead is ${o.overhead} ms.`:` Q = ${o.q} ms also meets the limit but costs ${o.overhead} ms of overhead.`)}
  else{pick=A.rt<=B.rt?A:B;why=`Neither quantum meets the ${thr} ms response limit, so Q = ${pick.q} ms is chosen for the lower average response time (${fmt(pick.rt)} ms).`}
  return`<b>Recommended quantum: ${pick.q} ms.</b> ${why}`;
 }
 const m=[['avg waiting time','wt'],['avg turnaround time','tat'],['context switches','sw'],['avg response time','rt']];
 let a=0,b=0,w=[];m.forEach(([n,k])=>{if(A[k]<B[k]){a++;w.push(`Q = ${A.q} ms wins on ${n} (${fmt(A[k])} vs ${fmt(B[k])})`)}else if(B[k]<A[k]){b++;w.push(`Q = ${B.q} ms wins on ${n} (${fmt(B[k])} vs ${fmt(A[k])})`)}});
 const pick=a>b?A:b>a?B:(A.wt<=B.wt?A:B);
 return`<b>Recommended quantum: ${pick.q} ms.</b> It wins ${Math.max(a,b)} of 4 measures. ${w.join('; ')}. A larger quantum cuts switching and waiting, while a smaller one gives each service CPU time sooner (better response). Choose the one whose wins matter most for the workload.`;
}

function build(act,root){
 const st={t:0,view:'A',play:false,speed:1,timer:null};
 const cfg={ov:act.ov,qA:act.qA,qB:act.qB,thr:act.thr,procs:act.procs.map(p=>({name:p[0],task:p[1],arrival:p[2],burst:p[3]}))};
 let SA,SB;
 root.innerHTML=`<section class="box"><h2>${act.title}</h2><div class="tw"><table><thead><tr><th>Process</th><th>Task</th><th>Arrival (ms)</th><th>Burst (ms)</th></tr></thead><tbody>${cfg.procs.map((p,i)=>`<tr><td><b style="color:${COL[i]}">${p.name}</b></td><td>${p.task}</td><td><input type="number" min="0" data-p="${i}" data-k="arrival" value="${p.arrival}"></td><td><input type="number" min="1" data-p="${i}" data-k="burst" value="${p.burst}"></td></tr>`).join('')}</tbody></table></div>
 <div class="row" style="margin-top:10px"><label class="f">Quantum A (ms)<input type="number" min="1" data-c="qA" value="${cfg.qA}"></label><label class="f">Quantum B (ms)<input type="number" min="1" data-c="qB" value="${cfg.qB}"></label><label class="f">Switch overhead (ms)<input type="number" min="0" data-c="ov" value="${cfg.ov}" ${act.ovEdit?'':'disabled'}></label>${act.ovEdit?`<label class="f">Max avg response (ms)<input type="number" min="1" data-c="thr" value="${cfg.thr}"></label>`:''}</div></section>
 <section class="box"><h2>Live simulation</h2><div class="ctl"><button data-a="play" class="on">Play</button><button data-a="back">Step back</button><button data-a="fwd">Step forward</button><button data-a="reset">Reset</button><label class="f" style="flex-direction:row;align-items:center;gap:6px">Speed<select data-a="speed"><option value="0.5">0.5x (2 s per ms)</option><option value="1" selected>1x (1 s per ms)</option><option value="2">2x</option><option value="4">4x</option></select></label><span class="clock num" data-r="clock"></span><input type="range" min="0" value="0" data-a="seek" aria-label="Time"></div>
 <div class="ctl"><span class="hint">Watch quantum:</span><button data-v="A" class="on"></button><button data-v="B"></button></div>
 <div class="narr" data-r="narr"></div>
 <div class="live"><div><div class="cpu" data-r="cpu"></div><div class="gl">Ready queue (front on the left)</div><div class="chips" data-r="queue"></div></div><div><div data-r="procs"></div></div></div>
 <div class="gl">Event log</div><div class="log" data-r="log"></div>
 <div data-r="gA"></div><div data-r="gB"></div><div data-r="lg"></div><div class="hint" style="margin-top:6px">Click a Gantt chart to jump to that time. Hover a block for details.</div></section>
 <section class="box"><h2>Per-process results</h2><div class="two" data-r="tabs"></div></section>
 <section class="box"><h2>Comparison</h2><div data-r="cmp"></div><div class="rec" data-r="rec"></div></section>`;
 const R=n=>root.querySelector(`[data-r=${n}]`);
 const cur=()=>st.view==='A'?SA:SB;
 function sim(){SA=simulate(cfg.procs,cfg.qA,cfg.ov);SB=simulate(cfg.procs,cfg.qB,cfg.ov);
  root.querySelector('[data-v=A]').textContent=`Q = ${cfg.qA} ms`;root.querySelector('[data-v=B]').textContent=`Q = ${cfg.qB} ms`;
  const mx=Math.max(SA.total,SB.total);root.querySelector('[data-a=seek]').max=cur().total;
  if(st.t>cur().total)st.t=cur().total;static_();draw()}
 function resTable(s){return`<div><div class="gl">Q = ${s.q} ms</div><div class="tw"><table><thead><tr><th>Proc</th><th>CT</th><th>TAT</th><th>WT</th><th>RT</th></tr></thead><tbody>${s.P.map(p=>`<tr><td><b style="color:${COL[p.i]}">${p.name}</b></td><td>${p.ct}</td><td>${p.tat}</td><td>${p.wt}</td><td>${p.rt}</td></tr>`).join('')}<tr><td><b>Average</b></td><td></td><td><b>${fmt(s.tat)}</b></td><td><b>${fmt(s.wt)}</b></td><td><b>${fmt(s.rt)}</b></td></tr></tbody></table></div><div class="hint">CT completion, TAT turnaround, WT waiting, RT response (ms)</div></div>`}
 function static_(){
  R('tabs').innerHTML=resTable(SA)+resTable(SB);
  const M=[['Avg turnaround (ms)','tat',1],['Avg waiting (ms)','wt',1],['Avg response (ms)','rt',1],['Context switches','sw',1],['Total overhead (ms)','overhead',1],['Total time (ms)','total',1],['CPU efficiency (%)','eff',0]];
  R('cmp').innerHTML=M.map(([n,k,low])=>{const a=SA[k],b=SB[k],mx=Math.max(a,b,1e-9),w=a===b?'':((low?a<b:a>b)?'A':'B');
   return`<div class="mrow"><div><b>${n}</b>${w?`<div class="win">Better: Q = ${(w==='A'?SA:SB).q} ms</div>`:'<div class="hint">Tie</div>'}</div><div><div class="mb"><i style="width:${a/mx*70}%;background:var(--ac)"></i><span class="num">Q ${SA.q}: ${fmt(a)}</span></div><div class="mb"><i style="width:${b/mx*70}%;background:var(--ac2)"></i><span class="num">Q ${SB.q}: ${fmt(b)}</span></div></div></div>`}).join('');
  R('rec').innerHTML=recommend({ovEdit:act.ovEdit,thr:cfg.thr},SA,SB);
  R('lg').innerHTML=legend(SA.P);
 }
 function draw(){
  const s=cur(),t=st.t,g=segAt(s,t);
  root.querySelector('[data-a=seek]').max=s.total;root.querySelector('[data-a=seek]').value=t;
  R('clock').textContent=`t = ${t} ms`;
  R('narr').innerHTML=`<b>Second ${t} to ${t+1}:</b> `+tickText(s,t,g);
  const cpu=R('cpu');
  if(!g){cpu.style.background='var(--ok)';cpu.innerHTML='<b>Finished</b>All processes complete';}
  else if(g.type==='run'){cpu.style.background=COL[g.p.i];cpu.innerHTML=`<b>${g.p.name} running</b>${g.p.task}<br>Slice ${g.s} to ${g.e} ms, ${g.remBefore-(t-g.s)} ms left before this tick`;}
  else if(g.type==='cs'){cpu.style.background='var(--cs)';cpu.innerHTML=`<b>Context switch</b>${g.from.name} → ${g.to.name}<br>Overhead, no process is running`;}
  else{cpu.style.background='var(--idle)';cpu.innerHTML='<b>Idle</b>No process ready';}
  const q=queueAt(s,t,g);
  R('queue').innerHTML=q.length?q.map(i=>`<span class="chip" style="background:${COL[i]}">${s.P[i].name}</span>`).join(''):'<span class="hint">Empty</span>';
  R('procs').innerHTML=s.P.map(p=>{
   const ex=executed(s,p.i,t),over=t>=p.ct;
   const state=t<p.arrival?'Not arrived':over?'Done':(g&&g.type==='run'&&g.p===p)?'Running':'Waiting';
   const wait=t<p.arrival?0:Math.min(t,p.ct)-p.arrival-ex;
   const col=state==='Running'?COL[p.i]:state==='Done'?'var(--ok)':state==='Waiting'?'var(--ac2)':'var(--mu)';
   return`<div class="pc"><b style="color:${COL[p.i]}">${p.name}</b><div><div class="bar"><i style="width:${(p.burst-ex)/p.burst*100}%;background:${COL[p.i]}"></i></div><span class="hint num">${p.burst-ex} of ${p.burst} ms left, waited ${wait} ms</span></div><div class="st" style="color:${col}">${state}</div></div>`}).join('');
  R('log').innerHTML=s.ev.filter(e=>e.t<=t).reverse().map(e=>`<div><b class="num">${e.t} ms</b> ${e.x}</div>`).join('')||'<div>Press play to begin.</div>';
  R('gA').innerHTML=gantt(SA,Math.min(t,SA.total),`Gantt chart, Q = ${SA.q} ms (total ${SA.total} ms)`);
  R('gB').innerHTML=gantt(SB,Math.min(t,SB.total),`Gantt chart, Q = ${SB.q} ms (total ${SB.total} ms)`);
 }
 function stop(){st.play=false;clearInterval(st.timer);root.querySelector('[data-a=play]').textContent='Play';}
 function go(){stop();st.play=true;root.querySelector('[data-a=play]').textContent='Pause';
  st.timer=setInterval(()=>{if(st.t>=cur().total){stop();return}st.t++;draw()},1000/st.speed)}
 root.addEventListener('click',e=>{
  const b=e.target.closest('button'),gw=e.target.closest('[data-g]');
  if(b){const a=b.dataset.a,v=b.dataset.v;
   if(a==='play'){st.play?stop():(st.t>=cur().total&&(st.t=0),go());draw()}
   if(a==='back'){stop();st.t=Math.max(0,st.t-1);draw()}
   if(a==='fwd'){stop();st.t=Math.min(cur().total,st.t+1);draw()}
   if(a==='reset'){stop();st.t=0;draw()}
   if(v){st.view=v;root.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('on',x===b));st.t=Math.min(st.t,cur().total);draw()}}
  else if(gw){const r=gw.querySelector('.gin').getBoundingClientRect();stop();st.t=Math.max(0,Math.min(cur().total,Math.round((e.clientX-r.left)/+gw.dataset.g)));draw()}
 });
 root.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.a==='seek'){stop();st.t=+el.value;draw()}
  else if(el.dataset.a==='speed'){st.speed=+el.value;if(st.play)go()}
  else if(el.dataset.p!==undefined){const v=+el.value;if(isNaN(v)||el.value==='')return;cfg.procs[+el.dataset.p][el.dataset.k]=el.dataset.k==='burst'?Math.max(1,Math.round(v)):Math.max(0,Math.round(v));stop();sim()}
  else if(el.dataset.c){const v=+el.value;if(isNaN(v)||el.value==='')return;cfg[el.dataset.c]=el.dataset.c==='ov'?Math.max(0,Math.round(v)):Math.max(1,Math.round(v));stop();sim()}
 });
 sim();
}

const app=document.getElementById('app'),tabs=document.getElementById('tabs');
const roots=ACTS.map(a=>{const d=document.createElement('div');app.appendChild(d);build(a,d);return d});
ACTS.forEach((a,i)=>{const b=document.createElement('button');b.textContent=`Activity ${i+1}`;b.onclick=()=>{roots.forEach((r,j)=>r.hidden=j!==i);[...tabs.children].forEach((x,j)=>x.classList.toggle('on',j===i))};tabs.appendChild(b)});
tabs.children[0].click();
</script></body></html>
